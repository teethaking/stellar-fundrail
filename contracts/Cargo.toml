[workspace]
resolver = "2"
members = [
    "funding_stream",
    "splitter",
    "registry",
    "token_vault",
]

[workspace.dependencies]
soroban-sdk = "26"

# Contracts must stay small: the network enforces a maximum contract size
# (128 KB on Mainnet). These settings keep the Wasm output as small as
# possible. `overflow-checks = true` keeps arithmetic panics enabled in
# release builds, so integer overflow is never silently wrapped on-chain.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Useful for debugging deployed contracts with `stellar contract logs`.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
